<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sugar Bloom - Pembukuan & Invoice Donat</title>
  
  <!-- Tailwind CSS & React Standalone Script CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-amber-50/40 text-slate-800 antialiased min-h-screen">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Helper Format Rupiah
    const formatRupiah = (number) => {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0
      }).format(number || 0);
    };

    // Constant Options
    const ACCOUNTS = ['BCA', 'BSI', 'Bank Jago', 'blu', 'Tunai', 'QRIS'];
    const TOPPINGS = ['Susu Coklat', 'Susu Putih'];
    const EXPENSE_CATEGORIES = [
      'Belanja Bahan Baku (Labu/Ubi/Tepung)',
      'Topping & Pelengkap',
      'Kemasan & Box',
      'Gas & Listrik Operasional',
      'Biaya Kurir / Ongkir',
      'Lain-lain'
    ];

    const DEFAULT_PRODUCTS = [
      { id: 'p1', name: 'Donat Labu Kuning', price: 3000, desc: 'Donat labu alami, empuk & wangi', active: true },
      { id: 'p2', name: 'Donat Ubi Ungu', price: 3000, desc: 'Donat ubi ungu pilihan, manis & lezat', active: true },
    ];

    // Transaksi awal diset KOSONG agar saldo mulai dari Rp 0
    const DEFAULT_TRANSACTIONS = [];

    // Main React Application
    function App() {
      const [activeTab, setActiveTab] = useState('order');

      // LocalStorage State Initializers
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('sb_products');
        return saved ? JSON.parse(saved) : DEFAULT_PRODUCTS;
      });

      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('sb_transactions');
        return saved ? JSON.parse(saved) : DEFAULT_TRANSACTIONS;
      });

      useEffect(() => {
        localStorage.setItem('sb_products', JSON.stringify(products));
      }, [products]);

      useEffect(() => {
        localStorage.setItem('sb_transactions', JSON.stringify(transactions));
      }, [transactions]);

      // Toast Notification State
      const [toastMessage, setToastMessage] = useState(null);
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // Order Form State
      const [orderCustomerName, setOrderCustomerName] = useState('');
      const [orderCustomerPhone, setOrderCustomerPhone] = useState('');
      const [orderPaymentStatus, setOrderPaymentStatus] = useState('Lunas');
      const [orderPaymentAccount, setOrderPaymentAccount] = useState('BCA');
      const [orderNotes, setOrderNotes] = useState('');
      const [cartItems, setCartItems] = useState({});

      // Active Modal Invoice
      const [activeInvoice, setActiveInvoice] = useState(null);
      const [isCopied, setIsCopied] = useState(false);

      // Expense Form State
      const [expenseAmount, setExpenseAmount] = useState('');
      const [expenseCategory, setExpenseCategory] = useState(EXPENSE_CATEGORIES[0]);
      const [expenseAccount, setExpenseAccount] = useState('Tunai');
      const [expenseDesc, setExpenseDesc] = useState('');

      // Ledger Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [typeFilter, setTypeFilter] = useState('ALL');
      const [accountFilter, setAccountFilter] = useState('ALL');

      // Product Form State
      const [editingProductId, setEditingProductId] = useState(null);
      const [newProdName, setNewProdName] = useState('');
      const [newProdPrice, setNewProdPrice] = useState('3000');
      const [newProdDesc, setNewProdDesc] = useState('');

      // Qty counter handler
      const handleQtyChange = (productId, topping, delta) => {
        const key = `${productId}_${topping}`;
        const current = cartItems[key] || 0;
        const next = Math.max(0, current + delta);
        setCartItems({ ...cartItems, [key]: next });
      };

      // Compute Cart Details
      const cartSummary = useMemo(() => {
        let total = 0;
        let itemsList = [];

        products.forEach(p => {
          TOPPINGS.forEach(top => {
            const key = `${p.id}_${top}`;
            const qty = cartItems[key] || 0;
            if (qty > 0) {
              const subtotal = p.price * qty;
              total += subtotal;
              itemsList.push({
                productId: p.id,
                name: `${p.name} (${top})`,
                topping: top,
                qty,
                price: p.price,
                subtotal
              });
            }
          });
        });

        return { total, itemsList };
      }, [cartItems, products]);

      // Cashflow Metrics (Otomatis terhitung ulang saat transaksi ditambah/dihapus)
      const cashFlowMetrics = useMemo(() => {
        let totalIncome = 0;
        let totalExpense = 0;
        const accountBalances = {};
        ACCOUNTS.forEach(acc => { accountBalances[acc] = 0; });

        transactions.forEach(t => {
          const amount = Number(t.amount) || 0;
          if (t.type === 'INCOME') {
            totalIncome += amount;
            if (accountBalances[t.account] !== undefined) accountBalances[t.account] += amount;
          } else if (t.type === 'EXPENSE') {
            totalExpense += amount;
            if (accountBalances[t.account] !== undefined) accountBalances[t.account] -= amount;
          }
        });

        return { totalIncome, totalExpense, netProfit: totalIncome - totalExpense, accountBalances };
      }, [transactions]);

      // Filtered Transactions
      const filteredTransactions = useMemo(() => {
        return transactions.filter(t => {
          const matchesSearch = 
            t.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (t.customerName && t.customerName.toLowerCase().includes(searchQuery.toLowerCase())) ||
            t.category.toLowerCase().includes(searchQuery.toLowerCase());
          
          const matchesType = typeFilter === 'ALL' || t.type === typeFilter;
          const matchesAccount = accountFilter === 'ALL' || t.account === accountFilter;

          return matchesSearch && matchesType && matchesAccount;
        });
      }, [transactions, searchQuery, typeFilter, accountFilter]);

      // Actions
      const handleSaveOrder = (e) => {
        e.preventDefault();
        if (cartSummary.itemsList.length === 0) {
          showToast('⚠️ Silakan pilih minimal 1 item donat.');
          return;
        }
        const name = orderCustomerName.trim() || 'Pelanggan Umum';
        const newTx = {
          id: `tx-${Date.now().toString().slice(-6)}`,
          date: new Date().toISOString(),
          type: 'INCOME',
          category: 'Penjualan Donat',
          amount: cartSummary.total,
          account: orderPaymentAccount,
          description: `Order ${name} (${cartSummary.itemsList.map(i => `${i.qty}x ${i.name}`).join(', ')})`,
          customerName: name,
          customerPhone: orderCustomerPhone.trim(),
          status: orderPaymentStatus,
          items: cartSummary.itemsList,
          notes: orderNotes.trim()
        };

        setTransactions([newTx, ...transactions]);
        setActiveInvoice({ ...newTx, total: cartSummary.total });

        // Reset
        setCartItems({});
        setOrderCustomerName('');
        setOrderCustomerPhone('');
        setOrderNotes('');
        setOrderPaymentStatus('Lunas');

        showToast('✅ Orderan & Pemasukan tersimpan!');
      };

      const handleSaveExpense = (e) => {
        e.preventDefault();
        const amt = Number(expenseAmount);
        if (!amt || amt <= 0) {
          showToast('⚠️ Masukkan nominal pengeluaran yang valid.');
          return;
        }

        const newTx = {
          id: `tx-${Date.now().toString().slice(-6)}`,
          date: new Date().toISOString(),
          type: 'EXPENSE',
          category: expenseCategory,
          amount: amt,
          account: expenseAccount,
          description: expenseDesc.trim() || expenseCategory,
          customerName: '',
          customerPhone: '',
          status: 'Lunas',
          items: []
        };

        setTransactions([newTx, ...transactions]);
        setExpenseAmount('');
        setExpenseDesc('');
        showToast('💸 Pengeluaran belanja berhasil dicatat!');
      };

      // Fitur Hapus Transaksi Tunggal
      const handleDeleteTransaction = (id) => {
        if (confirm('Apakah Anda yakin ingin menghapus transaksi ini? Saldo akan dihitung ulang.')) {
          setTransactions(transactions.filter(t => t.id !== id));
          showToast('🗑️ Transaksi berhasil dihapus!');
        }
      };

      // Fitur Reset Semua Data Transaksi ke Rp 0
      const handleResetAllTransactions = () => {
        if (confirm('⚠️ Yakin ingin menghapus seluruh riwayat transaksi? Semua saldo akan kembali ke Rp 0.')) {
          setTransactions([]);
          localStorage.removeItem('sb_transactions');
          showToast('🔄 Semua saldo berhasil di-reset ke Rp 0!');
        }
      };

      // WA Invoice Text Generator
      const generateWaText = (inv) => {
        if (!inv) return '';
        const itemLines = inv.items.map(i => `• ${i.qty}x ${i.name} (@ ${formatRupiah(i.price)}) = ${formatRupiah(i.subtotal)}`).join('\n');
        
        return `🍩 *INVOICE SUGAR BLOOM*
-----------------------------------
Halo Kak *${inv.customerName}*, terima kasih sudah order!

*Detail Pesanan:*
${itemLines}
${inv.notes ? `\n*Catatan:* ${inv.notes}` : ''}
-----------------------------------
*TOTAL:* *${formatRupiah(inv.total)}*
*Status Pembayaran:* ${inv.status.toUpperCase()} (${inv.account})
-----------------------------------
Terima kasih sudah mendukung langkah kecil Sugar Bloom. Semoga setiap gigitan membawa kebahagiaan. 🤎`;
      };

      const copyInvoiceText = () => {
        const text = generateWaText(activeInvoice);
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
        }
        setIsCopied(true);
        setTimeout(() => setIsCopied(false), 2000);
      };

      const openWhatsAppDirect = () => {
        const text = encodeURIComponent(generateWaText(activeInvoice));
        const phone = activeInvoice.customerPhone ? activeInvoice.customerPhone.replace(/[^0-9]/g, '') : '';
        const url = phone ? `https://wa.me/${phone}?text=${text}` : `https://wa.me/?text=${text}`;
        window.open(url, '_blank');
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        if (!newProdName.trim() || !newProdPrice) return;
        
        if (editingProductId) {
          setProducts(products.map(p => p.id === editingProductId ? {
            ...p,
            name: newProdName,
            price: Number(newProdPrice),
            desc: newProdDesc
          } : p));
          showToast('✏️ Menu berhasil diperbarui.');
        } else {
          setProducts([...products, {
            id: `p-${Date.now()}`,
            name: newProdName,
            price: Number(newProdPrice),
            desc: newProdDesc || 'Varian donat pilihan',
            active: true
          }]);
          showToast('🍩 Menu donat baru ditambahkan!');
        }
        setEditingProductId(null);
        setNewProdName('');
        setNewProdPrice('3000');
        setNewProdDesc('');
      };

      return (
        <div className="min-h-screen pb-16">
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed top-4 right-4 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 text-sm font-medium animate-bounce">
              <span>✨</span>
              <span>{toastMessage}</span>
            </div>
          )}

          {/* Navigation Header */}
          <header className="bg-gradient-to-r from-amber-600 to-orange-500 text-white sticky top-0 z-30 shadow-md">
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center font-bold text-xl shadow-inner">
                  🍩
                </div>
                <div>
                  <h1 className="text-lg font-bold tracking-wide leading-tight">Sugar Bloom</h1>
                  <p className="text-xs text-amber-100 font-medium">Semua Varian Rp 3.000 • Topping Coklat & Putih</p>
                </div>
              </div>
              
              <div className="flex items-center gap-2 bg-black/10 px-3 py-1.5 rounded-full text-xs font-semibold backdrop-blur-sm border border-white/10">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Kas: {formatRupiah(cashFlowMetrics.netProfit)}</span>
              </div>
            </div>

            {/* Menu Tabs */}
            <div className="max-w-6xl mx-auto px-4 flex gap-1 overflow-x-auto no-scrollbar pt-1 border-t border-white/10 text-xs md:text-sm font-medium">
              <button
                onClick={() => setActiveTab('order')}
                className={`px-4 py-2.5 rounded-t-xl transition-all whitespace-nowrap flex items-center gap-1.5 ${
                  activeTab === 'order' ? 'bg-white text-orange-600 font-bold shadow-sm' : 'text-amber-100 hover:bg-white/10'
                }`}
              >
                <span>🛍️</span> Catat Order & WA
              </button>

              <button
                onClick={() => setActiveTab('expense')}
                className={`px-4 py-2.5 rounded-t-xl transition-all whitespace-nowrap flex items-center gap-1.5 ${
                  activeTab === 'expense' ? 'bg-white text-orange-600 font-bold shadow-sm' : 'text-amber-100 hover:bg-white/10'
                }`}
              >
                <span>💸</span> Belanja / Pengeluaran
              </button>

              <button
                onClick={() => setActiveTab('dashboard')}
                className={`px-4 py-2.5 rounded-t-xl transition-all whitespace-nowrap flex items-center gap-1.5 ${
                  activeTab === 'dashboard' ? 'bg-white text-orange-600 font-bold shadow-sm' : 'text-amber-100 hover:bg-white/10'
                }`}
              >
                <span>📊</span> Ringkasan Kas
              </button>

              <button
                onClick={() => setActiveTab('ledger')}
                className={`px-4 py-2.5 rounded-t-xl transition-all whitespace-nowrap flex items-center gap-1.5 ${
                  activeTab === 'ledger' ? 'bg-white text-orange-600 font-bold shadow-sm' : 'text-amber-100 hover:bg-white/10'
                }`}
              >
                <span>📖</span> Buku Kas
              </button>

              <button
                onClick={() => setActiveTab('products')}
                className={`px-4 py-2.5 rounded-t-xl transition-all whitespace-nowrap flex items-center gap-1.5 ${
                  activeTab === 'products' ? 'bg-white text-orange-600 font-bold shadow-sm' : 'text-amber-100 hover:bg-white/10'
                }`}
              >
                <span>📦</span> Menu & Harga
              </button>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="max-w-6xl mx-auto px-4 py-6">

            {/* TAB 1: ORDER ENTRY */}
            {activeTab === 'order' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-7 space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="text-base font-bold text-slate-800">🍩 Pilih Donat Sugar Bloom</h2>
                    <span className="text-xs text-orange-600 font-bold bg-orange-100 px-2.5 py-1 rounded-full">
                      Semua Varian Rp 3.000
                    </span>
                  </div>

                  <div className="space-y-4">
                    {products.map(prod => (
                      <div key={prod.id} className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-3">
                        <div className="flex items-start justify-between">
                          <div>
                            <h3 className="font-bold text-slate-900 text-base">{prod.name}</h3>
                            <p className="text-xs text-slate-500 mt-0.5">{prod.desc}</p>
                          </div>
                          <span className="text-sm font-extrabold text-orange-600 bg-orange-50 px-3 py-1 rounded-xl">
                            {formatRupiah(prod.price)}
                          </span>
                        </div>

                        <div className="pt-2 border-t border-slate-100 space-y-2">
                          <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">
                            Pilih Topping:
                          </p>

                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            {TOPPINGS.map(topping => {
                              const key = `${prod.id}_${topping}`;
                              const qty = cartItems[key] || 0;
                              return (
                                <div key={topping} className={`flex items-center justify-between p-2.5 rounded-xl border ${qty > 0 ? 'bg-amber-50 border-orange-400' : 'bg-slate-50 border-slate-200'}`}>
                                  <div className="flex items-center gap-2">
                                    <span>{topping.includes('Coklat') ? '🍫' : '🥛'}</span>
                                    <div>
                                      <span className="text-xs font-bold block">{topping}</span>
                                      {qty > 0 && (
                                        <span className="text-[11px] font-semibold text-orange-600">
                                          {formatRupiah(qty * prod.price)}
                                        </span>
                                      )}
                                    </div>
                                  </div>

                                  <div className="flex items-center gap-2">
                                    <button
                                      type="button"
                                      onClick={() => handleQtyChange(prod.id, topping, -1)}
                                      disabled={qty === 0}
                                      className="w-7 h-7 rounded-lg bg-white border border-slate-200 text-slate-700 font-bold text-xs disabled:opacity-30"
                                    > - </button>
                                    <span className="w-5 text-center font-bold text-xs">{qty}</span>
                                    <button
                                      type="button"
                                      onClick={() => handleQtyChange(prod.id, topping, 1)}
                                      className="w-7 h-7 rounded-lg bg-orange-500 text-white font-bold text-xs shadow-sm hover:bg-orange-600"
                                    > + </button>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Cart Total Banner */}
                  <div className="bg-slate-900 text-white rounded-2xl p-4 shadow-md flex items-center justify-between">
                    <div>
                      <p className="text-xs text-slate-400 uppercase font-bold">Total Pesanan</p>
                      <p className="text-2xl font-black text-amber-400 mt-0.5">{formatRupiah(cartSummary.total)}</p>
                      <p className="text-xs text-slate-300 mt-0.5">
                        {cartSummary.itemsList.reduce((acc, curr) => acc + curr.qty, 0)} pcs donat dipilih
                      </p>
                    </div>

                    {cartSummary.itemsList.length > 0 && (
                      <button
                        onClick={() => setCartItems({})}
                        className="text-xs text-slate-400 hover:text-rose-300 underline"
                      >
                        Reset Pilihan
                      </button>
                    )}
                  </div>
                </div>

                {/* Right Form */}
                <div className="lg:col-span-5 space-y-4">
                  <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
                    <h3 className="font-bold text-slate-800 text-base mb-4">Detail Pembeli & Pembayaran</h3>

                    <form onSubmit={handleSaveOrder} className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Nama Pelanggan</label>
                        <input
                          type="text"
                          placeholder="Contoh: Kak Budi / Maya"
                          value={orderCustomerName}
                          onChange={(e) => setOrderCustomerName(e.target.value)}
                          className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-medium focus:ring-2 focus:ring-orange-400 outline-none"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">No. WhatsApp (Opsional)</label>
                        <input
                          type="text"
                          placeholder="Contoh: 08123456789"
                          value={orderCustomerPhone}
                          onChange={(e) => setOrderCustomerPhone(e.target.value)}
                          className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-medium focus:ring-2 focus:ring-orange-400 outline-none"
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Status Bayar</label>
                          <select
                            value={orderPaymentStatus}
                            onChange={(e) => setOrderPaymentStatus(e.target.value)}
                            className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm font-medium bg-white"
                          >
                            <option value="Lunas">Lunas</option>
                            <option value="DP">DP (Uang Muka)</option>
                            <option value="Belum Bayar">Belum Bayar</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Rekening Masuk</label>
                          <select
                            value={orderPaymentAccount}
                            onChange={(e) => setOrderPaymentAccount(e.target.value)}
                            className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm font-medium bg-white"
                          >
                            {ACCOUNTS.map(acc => (
                              <option key={acc} value={acc}>{acc}</option>
                            ))}
                          </select>
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Catatan Pesanan</label>
                        <input
                          type="text"
                          placeholder="Contoh: Dipisah 2 box"
                          value={orderNotes}
                          onChange={(e) => setOrderNotes(e.target.value)}
                          className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-medium focus:ring-2 focus:ring-orange-400 outline-none"
                        />
                      </div>

                      <button
                        type="submit"
                        className="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-orange-500/20 transition-all text-sm"
                      >
                        Simpan Order & Buat Invoice
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: EXPENSES */}
            {activeTab === 'expense' && (
              <div className="max-w-2xl mx-auto">
                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                  <h2 className="font-bold text-slate-800 text-base mb-4">Catat Pengeluaran Belanja</h2>
                  <form onSubmit={handleSaveExpense} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Nominal (Rp) *</label>
                      <input
                        type="number"
                        placeholder="0"
                        value={expenseAmount}
                        onChange={(e) => setExpenseAmount(e.target.value)}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-base font-bold text-slate-900 focus:ring-2 focus:ring-rose-400 outline-none"
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Kategori Belanja</label>
                        <select
                          value={expenseCategory}
                          onChange={(e) => setExpenseCategory(e.target.value)}
                          className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm font-medium bg-white"
                        >
                          {EXPENSE_CATEGORIES.map(cat => (
                            <option key={cat} value={cat}>{cat}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Sumber Dana</label>
                        <select
                          value={expenseAccount}
                          onChange={(e) => setExpenseAccount(e.target.value)}
                          className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm font-medium bg-white"
                        >
                          {ACCOUNTS.map(acc => (
                            <option key={acc} value={acc}>{acc}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Keterangan Belanja</label>
                      <input
                        type="text"
                        placeholder="Contoh: Beli topping susu coklat & 2kg Labu"
                        value={expenseDesc}
                        onChange={(e) => setExpenseDesc(e.target.value)}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-medium"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-rose-600/20 transition-all text-sm"
                    >
                      Simpan Pengeluaran
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* TAB 3: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
                    <p className="text-xs font-bold text-slate-400 uppercase">Total Pemasukan</p>
                    <h3 className="text-2xl font-black text-emerald-600 mt-1">{formatRupiah(cashFlowMetrics.totalIncome)}</h3>
                  </div>

                  <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
                    <p className="text-xs font-bold text-slate-400 uppercase">Total Pengeluaran</p>
                    <h3 className="text-2xl font-black text-rose-600 mt-1">{formatRupiah(cashFlowMetrics.totalExpense)}</h3>
                  </div>

                  <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
                    <p className="text-xs font-bold text-slate-400 uppercase">Laba Bersih Kas</p>
                    <h3 className={`text-2xl font-black mt-1 ${cashFlowMetrics.netProfit >= 0 ? 'text-indigo-600' : 'text-rose-600'}`}>
                      {formatRupiah(cashFlowMetrics.netProfit)}
                    </h3>
                  </div>
                </div>

                <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="font-bold text-slate-800 text-sm">Rincian Saldo Per Rekening</h3>
                    {transactions.length > 0 && (
                      <button
                        onClick={handleResetAllTransactions}
                        className="text-xs font-bold text-rose-600 hover:bg-rose-50 px-3 py-1.5 rounded-xl border border-rose-200 transition-colors"
                      >
                        🔄 Reset Semua Data ke Rp 0
                      </button>
                    )}
                  </div>
                  <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                    {ACCOUNTS.map(acc => (
                      <div key={acc} className="bg-slate-50 border border-slate-200 rounded-xl p-3 text-center">
                        <span className="text-xs font-bold text-slate-500 block uppercase">{acc}</span>
                        <span className="text-sm font-black mt-1 block">{formatRupiah(cashFlowMetrics.accountBalances[acc])}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: LEDGER */}
            {activeTab === 'ledger' && (
              <div className="space-y-4">
                <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-3 items-center justify-between">
                  <input
                    type="text"
                    placeholder="Cari transaksi..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full sm:w-64 px-3 py-2 rounded-xl border border-slate-200 text-xs font-medium"
                  />

                  <div className="flex gap-2 w-full sm:w-auto">
                    <select
                      value={typeFilter}
                      onChange={(e) => setTypeFilter(e.target.value)}
                      className="px-3 py-2 rounded-xl border border-slate-200 text-xs font-medium bg-white"
                    >
                      <option value="ALL">Semua Jenis</option>
                      <option value="INCOME">Masuk (Penjualan)</option>
                      <option value="EXPENSE">Keluar (Belanja)</option>
                    </select>

                    <select
                      value={accountFilter}
                      onChange={(e) => setAccountFilter(e.target.value)}
                      className="px-3 py-2 rounded-xl border border-slate-200 text-xs font-medium bg-white"
                    >
                      <option value="ALL">Semua Rekening</option>
                      {ACCOUNTS.map(acc => (
                        <option key={acc} value={acc}>{acc}</option>
                      ))}
                    </select>
                  </div>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold uppercase">
                      <tr>
                        <th className="px-4 py-3">Tanggal</th>
                        <th className="px-4 py-3">Keterangan</th>
                        <th className="px-4 py-3">Rekening</th>
                        <th className="px-4 py-3 text-right">Nominal</th>
                        <th className="px-4 py-3 text-center">Aksi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-medium">
                      {filteredTransactions.length === 0 ? (
                        <tr>
                          <td colSpan="5" className="px-4 py-8 text-center text-slate-400">
                            Belum ada transaksi. Klik "Catat Order" atau "Belanja" untuk mulai mengisi kas Sugar Bloom! 🍩
                          </td>
                        </tr>
                      ) : (
                        filteredTransactions.map(t => (
                          <tr key={t.id} className="hover:bg-slate-50">
                            <td className="px-4 py-3 text-slate-500">
                              {new Date(t.date).toLocaleDateString('id-ID', { day: '2-digit', month: 'short' })}
                            </td>
                            <td className="px-4 py-3 font-bold text-slate-900">{t.description}</td>
                            <td className="px-4 py-3"><span className="px-2 py-0.5 rounded bg-slate-100 font-bold">{t.account}</span></td>
                            <td className={`px-4 py-3 text-right font-bold text-sm ${t.type === 'INCOME' ? 'text-emerald-600' : 'text-rose-600'}`}>
                              {t.type === 'INCOME' ? '+' : '-'}{formatRupiah(t.amount)}
                            </td>
                            <td className="px-4 py-3 text-center">
                              <button
                                onClick={() => handleDeleteTransaction(t.id)}
                                className="text-rose-600 hover:bg-rose-50 px-2 py-1 rounded font-bold text-xs"
                              >
                                Hapus
                              </button>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB 5: PRODUCTS */}
            {activeTab === 'products' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-7 space-y-3">
                  <h2 className="font-bold text-slate-800 text-base mb-2">Menu Sugar Bloom</h2>
                  {products.map(p => (
                    <div key={p.id} className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex items-center justify-between">
                      <div>
                        <h3 className="font-bold text-slate-900 text-sm">{p.name}</h3>
                        <p className="text-xs text-slate-500 mt-1">{p.desc}</p>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="text-xs font-bold text-orange-600 bg-orange-100 px-2.5 py-1 rounded-md">{formatRupiah(p.price)}</span>
                        <button
                          onClick={() => {
                            setEditingProductId(p.id);
                            setNewProdName(p.name);
                            setNewProdPrice(p.price);
                            setNewProdDesc(p.desc);
                          }}
                          className="text-xs font-bold text-orange-600 hover:underline"
                        >Edit</button>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="lg:col-span-5">
                  <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
                    <h3 className="font-bold text-slate-800 text-base mb-4">
                      {editingProductId ? 'Edit Menu' : 'Tambah Menu Baru'}
                    </h3>
                    <form onSubmit={handleSaveProduct} className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Nama Menu</label>
                        <input
                          type="text"
                          value={newProdName}
                          onChange={(e) => setNewProdName(e.target.value)}
                          className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm font-medium"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Harga (Rp)</label>
                        <input
                          type="number"
                          value={newProdPrice}
                          onChange={(e) => setNewProdPrice(e.target.value)}
                          className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm font-medium"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Deskripsi</label>
                        <textarea
                          rows="2"
                          value={newProdDesc}
                          onChange={(e) => setNewProdDesc(e.target.value)}
                          className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm font-medium"
                        />
                      </div>
                      <button type="submit" className="w-full bg-orange-500 text-white font-bold py-2.5 rounded-xl text-xs">
                        {editingProductId ? 'Simpan Perubahan' : 'Tambah Menu'}
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* MODAL INVOICE WA */}
          {activeInvoice && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-slate-900 text-base">🍩 Invoice WA Sugar Bloom</h3>
                  <button onClick={() => setActiveInvoice(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                <div className="bg-amber-50/70 border border-amber-200 rounded-2xl p-4 font-mono text-xs text-slate-800 space-y-2 whitespace-pre-wrap max-h-60 overflow-y-auto">
                  {generateWaText(activeInvoice)}
                </div>

                <div className="space-y-2 pt-2">
                  <button
                    onClick={openWhatsAppDirect}
                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg text-sm flex items-center justify-center gap-2"
                  >
                    <span>📲 Kirim Langsung via WhatsApp</span>
                  </button>

                  <button
                    onClick={copyInvoiceText}
                    className="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-3 rounded-xl text-sm"
                  >
                    {isCopied ? '✅ Teks Tersalin!' : '📋 Salin Teks Invoice'}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
